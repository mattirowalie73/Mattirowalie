<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desa Digital Mattirowalie</title>
<style>
:root{--green:#087443;--green2:#045b35;--gold:#e5b84b;--cream:#f5f8f5;--text:#24332b;--muted:#68756d;--line:#dfe7e2}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--text);background:#fff;line-height:1.6}
.top{background:#075b38;color:#fff;padding:8px 5%;display:flex;justify-content:space-between;font-size:13px}
header{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 2px 10px #00000008}
.nav{max-width:1200px;margin:auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{display:flex;align-items:center;gap:12px;min-width:270px}.brand img{width:55px;height:55px;object-fit:contain}.brand strong{display:block;color:#222;font-size:19px;letter-spacing:.4px}.brand strong span{color:var(--green)}.brand small{color:var(--muted);font-size:12px}
nav{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:flex-end}nav a{color:#26332c;text-decoration:none;font-size:13px;font-weight:700;padding:10px 8px}nav a:hover{color:var(--green)}nav a.active{background:var(--green);color:#fff;border-radius:7px}nav .contact{background:var(--green);color:#fff;border-radius:7px}
.hero{min-height:500px;color:#fff;background:linear-gradient(90deg,#063d29dd,#087443aa),url('https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1800&q=80') center/cover}
.hero-inner{max-width:1200px;margin:auto;min-height:500px;padding:55px 20px;display:flex;align-items:center;justify-content:space-between;gap:45px}
.hero-copy{flex:1}.eyebrow{color:#f3cf63;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:2px}.hero h1{font-size:clamp(42px,6vw,70px);line-height:1.02;margin:12px 0}.hero h1 span{color:#7ee05d}.hero p{font-size:18px;max-width:650px;color:#edf7f1}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:25px}.actions a{text-decoration:none;padding:12px 18px;border-radius:7px;font-weight:800}.primary{background:var(--green);color:#fff}.secondary{background:#fff;color:#25342b}
.head{text-align:center;margin-bottom:30px}.head span{color:var(--green);font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase}.head h2{font-size:32px;margin:7px 0}.head p{max-width:680px;margin:auto;color:var(--muted)}
.wrap{max-width:1200px;margin:auto;padding:65px 20px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:23px;box-shadow:0 6px 20px #183d2b0a}.icon{width:44px;height:44px;border-radius:10px;background:#e7f4ed;display:grid;place-items:center;font-size:21px;margin-bottom:13px}.card h3{margin:0 0 7px}.card p{margin:0;color:var(--muted);font-size:14px}
.explore{background:var(--cream)}.profile{background:#f0f5f2}.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:25px}.profile-box{background:#fff;border:1px solid var(--line);border-radius:10px;padding:28px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);margin-top:28px;border:1px solid var(--line);border-radius:10px;overflow:hidden}.stat{background:#fff;text-align:center;padding:22px;border-right:1px solid var(--line)}.stat:last-child{border-right:0}.stat b{font-size:29px;color:var(--green);display:block}.stat span{color:var(--muted);font-size:13px}
.news{display:grid;grid-template-columns:1.2fr .8fr;gap:20px}.news-main,.news-list{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}.news-image{height:260px;background:url('https://images.unsplash.com/photo-1504150558240-0b4fd8946624?auto=format&fit=crop&w=1200&q=80') center/cover}.news-content{padding:22px}.date{font-size:11px;color:var(--green);font-weight:800}.news-content h3{font-size:24px;margin:7px 0}.news-content p,.news-list p{color:var(--muted);font-size:14px}.news-list article{padding:18px;border-bottom:1px solid var(--line)}.news-list article:last-child{border:0}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.gallery-card{height:190px;border-radius:10px;overflow:hidden;background:#e5eee9;display:flex;align-items:end;padding:18px;color:#fff;font-weight:800;background-size:cover;background-position:center;box-shadow:inset 0 -100px 80px #0008}
.contact-section{background:var(--green2);color:#fff}.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:30px}.contact-card{border:1px solid #ffffff2b;background:#ffffff0d;border-radius:10px;padding:25px}.contact-card p{color:#d8e9df}.contact-card b{color:#f4d36b}
footer{background:#033822;color:#d4e6dc;padding:25px 5%;display:flex;justify-content:space-between;gap:20px;font-size:13px}footer .foot-brand{display:flex;align-items:center;gap:10px}footer img{width:45px;height:45px;object-fit:contain}
@media(max-width:1000px){nav{gap:5px}nav a{font-size:12px}.cards{grid-template-columns:1fr 1fr}}
@media(max-width:800px){.top{display:none}.nav{align-items:flex-start;flex-direction:column}nav{justify-content:flex-start}.hero-inner{flex-direction:column;align-items:flex-start;padding-top:45px}.profile-grid,.contact-grid,.news{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.stat:nth-child(2){border-right:0}.gallery{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.cards,.gallery,.stats{grid-template-columns:1fr}.stat{border-right:0;border-bottom:1px solid var(--line)}.hero h1{font-size:43px}footer{flex-direction:column}}
/* Penyempurnaan bagian Tentang Desa */
#tentang-desa .profile-box{
    text-align:center;
    font-family:"Britannic Bold","Britannic",Arial,sans-serif;
    max-width:1050px;
    margin:0 auto;
    padding:36px 48px;
    line-height:1.8;
}
#tentang-desa .profile-box h3{
    font-family:"Britannic Bold","Britannic",Arial,sans-serif;
    font-size:28px;
    color:var(--green);
    margin:0 0 22px;
}
#tentang-desa .profile-box p{
    font-family:"Britannic Bold","Britannic",Arial,sans-serif;
    font-size:17px;
    text-align:center;
    margin:0 auto 18px;
    color:var(--text);
}
#tentang-desa .head h2,
#tentang-desa .head p{
    font-family:"Britannic Bold","Britannic",Arial,sans-serif;
}
@media(max-width:600px){
    #tentang-desa .profile-box{padding:28px 20px}
    #tentang-desa .profile-box h3{font-size:23px}
    #tentang-desa .profile-box p{font-size:15px}
}

.nav-dropdown{position:relative;display:inline-block}
.nav-dropdown-toggle{display:inline-block}
.nav-dropdown-menu{
    display:none;
    position:absolute;
    top:100%;
    left:0;
    min-width:190px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:9px;
    box-shadow:0 12px 30px rgba(0,0,0,.12);
    padding:7px;
    z-index:100;
}
.nav-dropdown-menu a{
    display:block;
    padding:10px 12px;
    border-radius:6px;
    white-space:nowrap;
}
.nav-dropdown-menu a:hover{background:#eef7f2;color:var(--green)}
.nav-dropdown:hover .nav-dropdown-menu{display:block}

html { scroll-behavior: smooth; }
section[id] {
    scroll-margin-top: 95px;
}
section.menu-target:target {
    animation: menuFocus .65s ease;
}
@keyframes menuFocus {
    0% { outline: 4px solid rgba(8,116,67,.28); outline-offset: -4px; }
    100% { outline: 0 solid transparent; outline-offset: 0; }
}
.nav-dropdown-menu a:focus,
nav > a:focus,
.brand:focus {
    outline: 2px solid var(--gold);
    outline-offset: 3px;
}

.contact-card a:hover{
    color:#f3cf63 !important;
    text-decoration:underline !important;
}

.whatsapp-float{
    position:fixed;
    right:22px;
    bottom:22px;
    width:58px;
    height:58px;
    border-radius:50%;
    background:#25D366;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    font-size:29px;
    box-shadow:0 8px 22px rgba(0,0,0,.22);
    z-index:999;
    transition:transform .2s ease, box-shadow .2s ease;
}
.whatsapp-float:hover{
    transform:scale(1.08);
    box-shadow:0 10px 28px rgba(0,0,0,.28);
}
.whatsapp-float-label{
    position:absolute;
    right:70px;
    white-space:nowrap;
    background:#075b38;
    color:#fff;
    font-size:12px;
    font-weight:700;
    padding:8px 11px;
    border-radius:7px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease;
}
.whatsapp-float:hover .whatsapp-float-label{opacity:1}
@media(max-width:520px){
    .whatsapp-float{right:16px;bottom:16px;width:54px;height:54px;font-size:27px}
}

footer,
footer *{
    font-family:"Bookman Old Style","Bookman",Georgia,serif !important;
}
footer strong{
    color:#fff;
    font-weight:700;
}

.hero-carousel{position:relative;min-height:560px;overflow:hidden;background:#063d29}
.hero-media{position:absolute;inset:0;z-index:0}
.hero-slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .7s ease,visibility .7s ease}
.hero-slide.active{opacity:1;visibility:visible}
.hero-media-item{width:100%;height:100%;display:block;object-fit:cover;object-position:center}
.hero-overlay{position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(3,48,32,.88),rgba(4,76,48,.63) 48%,rgba(2,35,25,.28))}
.hero-carousel-content{position:relative;z-index:3;min-height:560px;align-items:center;justify-content:flex-start}
.hero-carousel .hero-copy{max-width:720px;text-shadow:0 2px 14px rgba(0,0,0,.18)}
.hero-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:5;width:48px;height:48px;border:1px solid rgba(255,255,255,.55);border-radius:50%;background:rgba(0,0,0,.28);color:#fff;font-size:25px;cursor:pointer;backdrop-filter:blur(5px)}
.hero-arrow:hover{background:rgba(8,116,67,.9)}
.hero-prev{left:22px}.hero-next{right:22px}
.hero-dots{position:absolute;z-index:5;left:50%;bottom:28px;transform:translateX(-50%);display:flex;gap:9px}
.hero-dot{width:11px;height:11px;border:2px solid #fff;border-radius:50%;background:transparent;padding:0;cursor:pointer}
.hero-dot.active{background:#fff}
.hero-caption{position:absolute;z-index:5;right:25px;bottom:25px;display:flex;flex-direction:column;align-items:flex-end;color:#fff;text-shadow:0 2px 7px #000;font-size:12px}
.hero-caption strong{font-size:14px}.hero-caption span{opacity:.85;margin-top:2px}
@media(max-width:700px){
.hero-carousel,.hero-carousel-content{min-height:560px}
.hero-carousel-content{padding:45px 55px 90px 20px}
.hero-arrow{width:40px;height:40px;font-size:20px}
.hero-prev{left:10px}.hero-next{right:10px}
.hero-caption{left:20px;right:auto;bottom:25px;align-items:flex-start}
.hero-dots{bottom:22px}
}

/* Modern responsive navigation */
header{position:sticky;top:0;z-index:1000;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(8,116,67,.1);box-shadow:0 4px 22px rgba(15,56,37,.07)}
.main-nav{display:flex;align-items:center;justify-content:flex-end;gap:4px}
.nav-link{position:relative;display:inline-flex;align-items:center;gap:8px;padding:11px 13px;border-radius:9px;color:#26332c;text-decoration:none;font-size:13px;font-weight:800;transition:color .25s,background .25s,transform .25s}
.nav-link:after{content:"";position:absolute;left:13px;right:13px;bottom:5px;height:2px;border-radius:10px;background:var(--green);transform:scaleX(0);transition:transform .25s}
.nav-link:hover,.nav-link.active{color:var(--green);background:#edf7f1}
.nav-link:hover{transform:translateY(-1px)}
.nav-link:hover:after,.nav-link.active:after{transform:scaleX(1)}
.nav-icon{width:22px;height:22px;display:grid;place-items:center;border-radius:6px;font-size:15px;color:var(--green);background:#e5f3eb;transition:.25s}
.nav-link:hover .nav-icon,.nav-link.active .nav-icon{color:#fff;background:var(--green)}
.nav-contact{margin-left:5px;color:#fff;background:var(--green);box-shadow:0 7px 18px rgba(8,116,67,.2)}
.nav-contact:hover,.nav-contact.active{color:#fff;background:var(--green2)}
.nav-contact:after{display:none}.nav-contact .nav-icon{color:#fff;background:rgba(255,255,255,.16)}
.nav-toggle{display:none;width:44px;height:44px;border:1px solid var(--line);border-radius:9px;background:#fff;cursor:pointer;padding:9px}
.nav-toggle span{display:block;height:2px;margin:5px 0;border-radius:5px;background:var(--green);transition:transform .25s,opacity .25s}
body.nav-open .nav-toggle span:nth-child(1){transform:translateY(7px) rotate(45deg)}
body.nav-open .nav-toggle span:nth-child(2){opacity:0}
body.nav-open .nav-toggle span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
section[id]{scroll-margin-top:92px}
@media(max-width:1000px){.main-nav{gap:1px}.nav-link{padding:10px 8px;font-size:12px}}
@media(max-width:800px){.nav-toggle{display:block;margin-left:auto}.main-nav{display:none;position:absolute;left:20px;right:20px;top:calc(100% + 8px);padding:8px;flex-direction:column;align-items:stretch;gap:4px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 15px 35px rgba(0,0,0,.13)}body.nav-open .main-nav{display:flex}.nav-link{width:100%;padding:12px 13px}.nav-contact{margin:3px 0 0;justify-content:center}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
.live-datetime{display:flex;align-items:center;gap:9px;margin-left:auto;margin-right:10px;padding:8px 12px;border:1px solid rgba(8,116,67,.12);border-radius:10px;background:#f3faf6;color:#16422f;white-space:nowrap}.live-date-icon{width:31px;height:31px;display:grid;place-items:center;border-radius:8px;color:#fff;background:var(--green);font-size:17px}.live-datetime strong{display:block;font-size:12px;line-height:1.25}.live-datetime small{display:block;color:var(--muted);font-size:10px;margin-top:2px}@media(max-width:800px){.live-datetime{margin-right:8px;padding:6px 8px}.live-datetime small{display:none}.live-datetime strong{font-size:11px}.live-date-icon{width:28px;height:28px;font-size:15px}}@media(max-width:520px){.live-date-icon{display:none}.live-datetime strong{font-size:10px}}</style>
<style>
.profile-menu{position:relative}.profile-menu>a{display:flex;gap:5px;align-items:center}.profile-menu>a:after{content:"▾";font-size:10px}
.profile-dropdown{position:absolute;top:100%;left:0;min-width:225px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 35px #0002;padding:7px;display:none;z-index:100}
.profile-menu:hover .profile-dropdown,.profile-menu:focus-within .profile-dropdown{display:block}.profile-dropdown a{display:block!important;padding:10px 12px!important;border-radius:7px;white-space:nowrap}.profile-dropdown a:hover{background:#e8f4ed;color:var(--green)}
.focus-section{scroll-margin-top:120px}.focus-title{display:flex;align-items:center;gap:12px}.focus-title .num{width:38px;height:38px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:800}
.profile-kades{display:grid;grid-template-columns:330px 1fr;gap:30px;align-items:center}.profile-kades img{width:100%;height:390px;object-fit:cover;object-position:center top;border-radius:12px;border:4px solid #fff;box-shadow:0 12px 30px #0002}
.org-box{min-height:250px;background:linear-gradient(135deg,#e8f4ed,#fff);border:1px dashed #9bbcab;border-radius:12px;padding:30px;display:grid;place-items:center;text-align:center}
.map-box{display:grid;grid-template-columns:1fr 1fr;gap:18px}.map-card{background:#eef6f1;border-radius:12px;padding:25px;border:1px solid #d8e6dd}.map-visual{min-height:260px;border-radius:12px;background:linear-gradient(135deg,#dcefe4,#c5e4d2);position:relative;overflow:hidden}.map-visual:before{content:"";position:absolute;left:12%;right:12%;top:18%;bottom:18%;border:3px solid var(--green);border-radius:45% 55% 52% 48%;transform:rotate(-8deg)}.map-label{position:absolute;background:#fff;padding:5px 9px;border-radius:6px;font-size:11px;font-weight:700;box-shadow:0 4px 12px #0002}
.perangkat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.person-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:20px;text-align:center}.person-avatar{width:68px;height:68px;margin:0 auto 12px;border-radius:50%;background:#e8f4ed;color:var(--green);display:grid;place-items:center;font-size:25px;font-weight:800}
@media(max-width:800px){.profile-dropdown{position:static;box-shadow:none;border:0;background:#f6faf7;margin:5px 0}.profile-menu:hover .profile-dropdown{display:none}.profile-menu:focus-within .profile-dropdown{display:block}.profile-kades,.map-box{grid-template-columns:1fr}.perangkat-grid{grid-template-columns:1fr 1fr}}

/* Peta Desa - Peta Administrasi & Potensi */
.map-box{display:block}
.map-gallery{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
.map-photo-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 8px 24px rgba(24,61,43,.08)}
.map-photo-card h3{margin:4px 6px 12px;color:var(--green);font-size:18px;text-align:center}
.map-photo-link{display:block;border-radius:10px;overflow:hidden;cursor:zoom-in;background:#eef6f1}
.map-photo{display:block;width:100%;height:330px;object-fit:contain;background:#f4f7f5;transition:transform .35s ease}
.map-photo-link:hover .map-photo{transform:scale(1.025)}
.map-info-card{background:#eef6f1;border-radius:14px;padding:25px;border:1px solid #d8e6dd}
.map-info-card h3{margin-top:0}
@media(max-width:800px){
  .map-gallery{grid-template-columns:1fr}
  .map-photo{height:auto;max-height:420px}
}
